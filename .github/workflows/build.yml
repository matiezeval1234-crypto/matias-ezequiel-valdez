          cat << 'EOF' > app/src/main/java/com/mativaldez/vpnclient/ConfigStorage.kt
          package com.mativaldez.vpnclient

          import android.content.Context
          import android.net.Uri
          import android.util.Base64
          import androidx.security.crypto.EncryptedSharedPreferences
          import androidx.security.crypto.MasterKey
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import javax.crypto.Cipher
          import javax.crypto.spec.IvParameterSpec
          import javax.crypto.spec.SecretKeySpec

          data class CarrierProfile(
              val proxy: String,
              val ssh: String,
              val customHeader: String
          )

          object ConfigStorage {
              private const val SECRET_KEY = "MatiValdezVpnKey2026Segura123456"
              private const val INIT_VECTOR = "VectorInicial123"

              private fun getPrefs(context: Context) = EncryptedSharedPreferences.create(
                  context,
                  "vpn_secure_prefs",
                  MasterKey.Builder(context).setKeyScheme(MasterKey.KeyScheme.AES256_GCM).build(),
                  EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,
                  EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM
              )

              fun importAndSaveConfig(context: Context, uri: Uri): Boolean {
                  return try {
                      val inputStream = context.contentResolver.openInputStream(uri) ?: return false
                      val encryptedBase64 = BufferedReader(InputStreamReader(inputStream)).use { it.readText().trim() }
                      val decryptedJson = decryptAes(encryptedBase64)

                      val obj = JSONObject(decryptedJson)
                      if (!obj.has("personal") || !obj.has("claro")) return false

                      getPrefs(context).edit().putString("raw_config_json", decryptedJson).apply()
                      true
                  } catch (e: Exception) {
                      false
                  }
              }

              fun hasConfigLoaded(context: Context): Boolean {
                  return !getPrefs(context).getString("raw_config_json", null).isNullOrEmpty()
              }

              fun getProfile(context: Context, carrierKey: String): CarrierProfile? {
                  val rawJson = getPrefs(context).getString("raw_config_json", null) ?: return null
                  return try {
                      val carrierObj = JSONObject(rawJson).getJSONObject(carrierKey)
                      CarrierProfile(
                          proxy = carrierObj.optString("proxy", ""),
                          ssh = carrierObj.optString("ssh", ""),
                          customHeader = carrierObj.optString("customHeader", "")
                      )
                  } catch (e: Exception) {
                      null
                  }
              }

              fun saveCredentials(context: Context, user: String, pass: String, carrier: String, remember: Boolean) {
                  val editor = getPrefs(context).edit()
                  editor.putString("selected_carrier", carrier)
                  editor.putBoolean("remember", remember)
                  if (remember) {
                      editor.putString("username", user)
                      editor.putString("password", pass)
                  } else {
                      editor.remove("username")
                      editor.remove("password")
                  }
                  editor.apply()
              }

              fun getSavedUsername(context: Context): String = getPrefs(context).getString("username", "") ?: ""
              fun getSavedPassword(context: Context): String = getPrefs(context).getString("password", "") ?: ""
              fun getSavedCarrier(context: Context): String = getPrefs(context).getString("selected_carrier", "personal") ?: "personal"
              fun isRememberEnabled(context: Context): Boolean = getPrefs(context).getBoolean("remember", true)

              private fun decryptAes(encryptedBase64: String): String {
                  val iv = IvParameterSpec(INIT_VECTOR.toByteArray(Charsets.UTF_8))
                  val keySpec = SecretKeySpec(SECRET_KEY.toByteArray(Charsets.UTF_8), "AES")
                  val cipher = Cipher.getInstance("AES/CBC/PKCS5PADDING")
                  cipher.init(Cipher.DECRYPT_MODE, keySpec, iv)
                  val decoded = Base64.decode(encryptedBase64, Base64.DEFAULT)
                  return String(cipher.doFinal(decoded), Charsets.UTF_8)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/mativaldez/vpnclient/MainActivity.kt
          package com.mativaldez.vpnclient

          import android.annotation.SuppressLint
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Color
          import android.net.Uri
          import android.net.VpnService
          import android.os.Build
          import android.os.Bundle
          import android.os.PowerManager
          import android.provider.Settings
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import com.google.android.material.button.MaterialButton
          import com.google.android.material.textfield.TextInputEditText

          class MainActivity : AppCompatActivity() {

              private lateinit var tvConfigStatus: TextView
              private lateinit var tvConnectionState: TextView
              private lateinit var btnConnect: MaterialButton
              private lateinit var etUsername: TextInputEditText
              private lateinit var etPassword: TextInputEditText
              private lateinit var cbRemember: CheckBox
              private lateinit var rgCarrier: RadioGroup
              private var isConnected = false

              private val filePickerLauncher = registerForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                  if (uri != null) {
                      val ok = ConfigStorage.importAndSaveConfig(this, uri)
                      if (ok) {
                          updateConfigLabel()
                          Toast.makeText(this, "Configuracion cargada con exito", Toast.LENGTH_SHORT).show()
                      } else {
                          Toast.makeText(this, "Archivo invalido o danado", Toast.LENGTH_LONG).show()
                      }
                  }
              }

              private val vpnPermissionLauncher = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->
                  if (result.resultCode == RESULT_OK) {
                      startTunnelService()
                  } else {
                      Toast.makeText(this, "Permiso VPN necesario para conectar", Toast.LENGTH_SHORT).show()
                  }
              }

              private val statusReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      val state = intent?.getStringExtra("STATE") ?: return
                      val detail = intent.getStringExtra("DETAIL") ?: ""
                      tvConnectionState.text = "Estado: $detail"

                      when (state) {
                          "CONNECTED" -> {
                              isConnected = true
                              btnConnect.text = "DESCONECTAR"
                              btnConnect.setBackgroundColor(Color.parseColor("#EF4444"))
                              tvConnectionState.setTextColor(Color.parseColor("#10B981"))
                          }
                          "CONNECTING" -> {
                              btnConnect.text = "CANCELAR"
                              btnConnect.setBackgroundColor(Color.parseColor("#F59E0B"))
                              tvConnectionState.setTextColor(Color.parseColor("#F59E0B"))
                          }
                          "DISCONNECTED" -> {
                              isConnected = false
                              btnConnect.text = "CONECTAR"
                              btnConnect.setBackgroundColor(Color.parseColor("#10B981"))
                              tvConnectionState.setTextColor(Color.parseColor("#94A3B8"))
                          }
                      }
                  }
              }

              @SuppressLint("BatteryLife")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  tvConfigStatus = findViewById(R.id.tvConfigStatus)
                  tvConnectionState = findViewById(R.id.tvConnectionState)
                  btnConnect = findViewById(R.id.btnConnect)
                  etUsername = findViewById(R.id.etUsername)
                  etPassword = findViewById(R.id.etPassword)
                  cbRemember = findViewById(R.id.cbRemember)
                  rgCarrier = findViewById(R.id.rgCarrier)

                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                      val intent = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                          data = Uri.parse("package:$packageName")
                      }
                      startActivity(intent)
                  }

                  etUsername.setText(ConfigStorage.getSavedUsername(this))
                  etPassword.setText(ConfigStorage.getSavedPassword(this))
                  cbRemember.isChecked = ConfigStorage.isRememberEnabled(this)
                  if (ConfigStorage.getSavedCarrier(this) == "claro") {
                      rgCarrier.check(R.id.rbClaro)
                  } else {
                      rgCarrier.check(R.id.rbPersonal)
                  }
                  updateConfigLabel()

                  findViewById<MaterialButton>(R.id.btnImportConfig).setOnClickListener {
                      filePickerLauncher.launch("*/*")
                  }

                  btnConnect.setOnClickListener {
                      if (isConnected) {
                          stopTunnelService()
                      } else {
                          validateAndConnect()
                      }
                  }
              }

              private fun updateConfigLabel() {
                  if (ConfigStorage.hasConfigLoaded(this)) {
                      tvConfigStatus.text = "Perfiles Personal y Claro listos"
                      tvConfigStatus.setTextColor(Color.parseColor("#10B981"))
                  } else {
                      tvConfigStatus.text = "Sin archivo de configuracion (.vcfg)"
                      tvConfigStatus.setTextColor(Color.parseColor("#F59E0B"))
                  }
              }

              private fun validateAndConnect() {
                  if (!ConfigStorage.hasConfigLoaded(this)) {
                      Toast.makeText(this, "Primero carga el archivo .vcfg", Toast.LENGTH_LONG).show()
                      return
                  }
                  val user = etUsername.text?.toString()?.trim() ?: ""
                  val pass = etPassword.text?.toString()?.trim() ?: ""
                  if (user.isEmpty() || pass.isEmpty()) {
                      Toast.makeText(this, "Ingresa tu usuario y contrasena", Toast.LENGTH_SHORT).show()
                      return
                  }

                  val selectedCarrier = if (rgCarrier.checkedRadioButtonId == R.id.rbClaro) "claro" else "personal"
                  ConfigStorage.saveCredentials(this, user, pass, selectedCarrier, cbRemember.isChecked)

                  val vpnIntent = VpnService.prepare(this)
                  if (vpnIntent != null) {
                      vpnPermissionLauncher.launch(vpnIntent)
                  } else {
                      startTunnelService()
                  }
              }

              private fun startTunnelService() {
                  val selectedCarrier = if (rgCarrier.checkedRadioButtonId == R.id.rbClaro) "claro" else "personal"
                  val intent = Intent(this, TunnelVpnService::class.java).apply {
                      action = "ACTION_CONNECT"
                      putExtra("CARRIER", selectedCarrier)
                      putExtra("USER", etUsername.text.toString().trim())
                      putExtra("PASS", etPassword.text.toString().trim())
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(intent)
                  } else {
                      startService(intent)
                  }
              }

              private fun stopTunnelService() {
                  val intent = Intent(this, TunnelVpnService::class.java).apply {
                      action = "ACTION_DISCONNECT"
                  }
                  startService(intent)
              }

              override fun onResume() {
                  super.onResume()
                  val filter = IntentFilter("VPN_STATE_UPDATE")
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(statusReceiver, filter, Context.RECEIVER_NOT_EXPORTED)
                  } else {
                      registerReceiver(statusReceiver, filter)
                  }
              }

              override fun onPause() {
                  super.onPause()
                  unregisterReceiver(statusReceiver)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/mativaldez/vpnclient/TunnelVpnService.kt
          package com.mativaldez.vpnclient

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.net.VpnService
          import android.os.Build
          import android.os.ParcelFileDescriptor
          import android.os.PowerManager
          import androidx.core.app.NotificationCompat
          import com.jcraft.jsch.JSch
          import com.jcraft.jsch.Proxy
          import com.jcraft.jsch.Session
          import com.jcraft.jsch.SocketFactory
          import java.io.InputStream
          import java.io.OutputStream
          import java.net.InetSocketAddress
          import java.net.Socket
          import java.util.Properties
          import java.util.concurrent.atomic.AtomicBoolean

          class TunnelVpnService : VpnService() {

              private var vpnInterface: ParcelFileDescriptor? = null
              private var sshSession: Session? = null
              private var wakeLock: PowerManager.WakeLock? = null
              private val isRunning = AtomicBoolean(false)
              private var workerThread: Thread? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      "ACTION_CONNECT" -> {
                          val carrier = intent.getStringExtra("CARRIER") ?: "personal"
                          val user = intent.getStringExtra("USER") ?: ""
                          val pass = intent.getStringExtra("PASS") ?: ""
                          startForeground(1, buildNotification("Conectando a ${carrier.uppercase()}..."))
                          acquireWakeLock()
                          startConnectionLoop(carrier, user, pass)
                      }
                      "ACTION_DISCONNECT" -> {
                          stopTunnel()
                          stopSelf()
                      }
                  }
                  return START_STICKY
              }

              private fun acquireWakeLock() {
                  if (wakeLock == null) {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "MVVpn::TunnelWakeLock")
                      wakeLock?.acquire()
                  }
              }

              private fun startConnectionLoop(carrier: String, user: String, pass: String) {
                  if (isRunning.getAndSet(true)) return

                  workerThread = Thread {
                      val profile = ConfigStorage.getProfile(this, carrier)
                      if (profile == null) {
                          broadcastState("DISCONNECTED", "Error en archivo .vcfg")
                          isRunning.set(false)
                          return@Thread
                      }

                      while (isRunning.get()) {
                          try {
                              broadcastState("CONNECTING", "Fase 1: Preparando red (${carrier.uppercase()})...")
                              updateNotification("Inicializando perfil ${carrier.uppercase()}...")

                              val sshParts = profile.ssh.split(":")
                              val sshHost = sshParts[0]
                              val sshPort = if (sshParts.size > 1) sshParts[1].toInt() else 22

                              val jsch = JSch()
                              val session = jsch.getSession(user, sshHost, sshPort)
                              session.setPassword(pass)

                              val config = Properties()
                              config["StrictHostKeyChecking"] = "no"
                              config["PreferredAuthentications"] = "password,keyboard-interactive"
                              session.setConfig(config)

                              if (profile.proxy.isNotEmpty()) {
                                  session.setProxy(CustomHeaderProxy(profile.proxy, profile.customHeader))
                              }

                              broadcastState("CONNECTING", "Fase 2: Autenticando usuario $user...")
                              updateNotification("Verificando usuario $user...")
                              session.serverAliveInterval = 10000
                              session.serverAliveCountMax = 3
                              session.connect(15000)
                              sshSession = session

                              if (vpnInterface == null) {
                                  val builder = Builder()
                                      .setSession("MV Conexion - ${carrier.uppercase()}")
                                      .setMtu(1400)
                                      .addAddress("10.8.0.2", 24)
                                      .addDnsServer("8.8.8.8")
                                      .addDnsServer("1.1.1.1")
                                      .addRoute("0.0.0.0", 0)
                                      .addDisallowedApplication(packageName)

                                  vpnInterface = builder.establish()
                              }

                              broadcastState("CONNECTED", "Conectado (${carrier.uppercase()})")
                              updateNotification("Conectado - ${carrier.uppercase()} Activo")

                              while (isRunning.get() && session.isConnected) {
                                  Thread.sleep(2000)
                              }

                          } catch (e: Exception) {
                              if (isRunning.get()) {
                                  broadcastState("CONNECTING", "Reconectando automaticamente...")
                                  updateNotification("Senal inestable, reconectando...")
                                  try { Thread.sleep(3000) } catch (_: InterruptedException) {}
                              }
                          } finally {
                              try { sshSession?.disconnect() } catch (_: Exception) {}
                          }
                      }
                      broadcastState("DISCONNECTED", "Desconectado")
                  }
                  workerThread?.start()
              }

              inner class CustomHeaderProxy(
                  private val proxyAddress: String,
                  private val rawCustomHeader: String
              ) : Proxy {
                  private var socket: Socket? = null
                  private var ins: InputStream? = null
                  private var outs: OutputStream? = null

                  override fun connect(socketFactory: SocketFactory?, host: String?, port: Int, timeout: Int) {
                      val parts = proxyAddress.split(":")
                      val pHost = parts[0]
                      val pPort = if (parts.size > 1) parts[1].toInt() else 80

                      socket = Socket()
                      protect(socket!!)
                      socket!!.tcpNoDelay = true
                      socket!!.keepAlive = true
                      socket!!.connect(InetSocketAddress(pHost, pPort), timeout)

                      ins = socket!!.getInputStream()
                      outs = socket!!.getOutputStream()

                      if (rawCustomHeader.isNotEmpty()) {
                          val formatted = rawCustomHeader
                              .replace("[host_port]", "$host:$port")
                              .replace("[crlf]", "\r\n")
                              .replace("[lf]", "\n")

                          val blocks = formatted.split("[split]")
                          for (block in blocks) {
                              if (block.isNotEmpty()) {
                                  outs!!.write(block.toByteArray(Charsets.UTF_8))
                                  outs!!.flush()
                                  Thread.sleep(120)
                              }
                          }
                      }
                  }

                  override fun getInputStream(): InputStream? = ins
                  override fun getOutputStream(): OutputStream? = outs
                  override fun getSocket(): Socket? = socket
                  override fun close() {
                      try { socket?.close() } catch (_: Exception) {}
                  }
              }

              private fun stopTunnel() {
                  isRunning.set(false)
                  workerThread?.interrupt()
                  try { sshSession?.disconnect() } catch (_: Exception) {}
                  try { vpnInterface?.close() } catch (_: Exception) {}
                  vpnInterface = null
                  if (wakeLock?.isHeld == true) {
                      wakeLock?.release()
                  }
                  wakeLock = null
                  stopForeground(true)
                  broadcastState("DISCONNECTED", "Desconectado")
              }

              private fun broadcastState(state: String, detail: String) {
                  val intent = Intent("VPN_STATE_UPDATE").apply {
                      setPackage(packageName)
                      putExtra("STATE", state)
                      putExtra("DETAIL", detail)
                  }
                  sendBroadcast(intent)
              }

              private fun updateNotification(text: String) {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.notify(1, buildNotification(text))
              }

              private fun buildNotification(text: String): Notification {
                  val channelId = "vpn_persistent_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "Estado de Conexion VPN",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.createNotificationChannel(channel)
                  }

                  val pendingIntent = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )

                  return NotificationCompat.Builder(this, channelId)
                      .setContentTitle("MV Conexion Segura")
                      .setContentText(text)
                      .setSmallIcon(android.R.drawable.ic_lock_lock)
                      .setContentIntent(pendingIntent)
                      .setOngoing(true)
                      .build()
              }

              override fun onDestroy() {
                  stopTunnel()
                  super.onDestroy()
              }
          }
